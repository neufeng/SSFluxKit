<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>购物车空态 — SSFluxKit 电商 UI 设计稿</title>
    <link rel="stylesheet" href="../phone-shell.css" />
    <style>
      .page-title-bar {
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--ss-color-surface);
        font-size: var(--ss-font-size-lg);
        font-weight: var(--ss-font-weight-semibold);
        border-bottom: 1px solid var(--ss-color-divider);
      }
      .empty-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: var(--ss-space-8) var(--ss-space-6);
        text-align: center;
        background: var(--ss-color-bg);
      }
      .empty-illus {
        width: 160px;
        height: 160px;
        margin-bottom: var(--ss-space-5);
        background: linear-gradient(145deg, #e3f2fd, #bbdefb);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .empty-illus svg {
        width: 80px;
        height: 80px;
        color: var(--ss-color-primary);
        opacity: 0.7;
      }
      .empty-wrap h3 {
        font-size: var(--ss-font-size-lg);
        margin-bottom: var(--ss-space-2);
        color: var(--ss-color-text-primary);
      }
      .empty-wrap p {
        font-size: var(--ss-font-size-sm);
        color: var(--ss-color-text-tertiary);
        margin-bottom: var(--ss-space-6);
        line-height: var(--ss-line-height-normal);
      }
    </style>
  </head>
  <body>
    <div class="phone" id="screen">
      <div class="status-bar"><span>9:41</span><span></span></div>
      <div class="page-title-bar">购物车</div>
      <div class="screen-body">
        <div class="empty-wrap">
          <div class="empty-illus">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.32-.58.1-1.31-.49-1.63A1 1 0 0 0 20 4H5.21l-.94-2H1zm16 16c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
          </div>
          <h3>购物车还是空的</h3>
          <p>快去挑选心仪好物吧<br />此处为 UI 演示，未连接真实商品与库存</p>
          <button type="button" class="btn-primary">去逛逛</button>
        </div>
        <nav class="tab-bar">
          <div class="tab-item"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>首页</div>
          <div class="tab-item"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6 10h4v-4h-4v4zm0-6h4v-4h-4v4z"/></svg>分类</div>
          <div class="tab-item active"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0 0 20 4H5.21l-.94-2H1zm16 16c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>购物车</div>
          <div class="tab-item"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>我的</div>
        </nav>
      </div>
    </div>
  </body>
</html>
