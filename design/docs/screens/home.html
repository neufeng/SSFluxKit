<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>首页 — SSFluxKit 电商 UI 设计稿</title>
    <link rel="stylesheet" href="../phone-shell.css" />
    <style>
      .home-header {
        background: linear-gradient(180deg, #1565c0 0%, #1976d2 55%, #f5f6f8 100%);
        padding: 0 var(--ss-space-4) var(--ss-space-4);
      }
      .home-header .status-bar {
        background: transparent;
        color: white;
      }
      .location-row {
        display: flex;
        align-items: center;
        gap: var(--ss-space-2);
        color: white;
        font-size: var(--ss-font-size-sm);
        margin-bottom: var(--ss-space-3);
      }
      .search-box {
        display: flex;
        align-items: center;
        gap: var(--ss-space-2);
        background: white;
        border-radius: var(--ss-radius-pill);
        padding: 10px var(--ss-space-4);
        box-shadow: var(--ss-shadow-sm);
      }
      .search-box input {
        border: none;
        flex: 1;
        font-size: var(--ss-font-size-base);
        outline: none;
        font-family: inherit;
        color: var(--ss-color-text-tertiary);
      }
      .banner {
        margin: var(--ss-space-3) var(--ss-space-4) 0;
        height: 140px;
        border-radius: var(--ss-radius-lg);
        background: linear-gradient(120deg, #ff6f60 0%, #e53935 45%, #c62828 100%);
        position: relative;
        overflow: hidden;
        box-shadow: var(--ss-shadow-md);
      }
      .banner::after {
        content: "";
        position: absolute;
        right: -20px;
        bottom: -30px;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
      }
      .banner-text {
        position: absolute;
        left: var(--ss-space-5);
        top: 50%;
        transform: translateY(-50%);
        color: white;
      }
      .banner-text h2 {
        font-size: 22px;
        font-weight: var(--ss-font-weight-bold);
        margin-bottom: 6px;
      }
      .banner-text p {
        font-size: var(--ss-font-size-sm);
        opacity: 0.9;
      }
      .banner-dots {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
      }
      .banner-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.4);
      }
      .banner-dots span.active {
        width: 16px;
        border-radius: 3px;
        background: white;
      }
      .quick-nav {
        margin: var(--ss-space-4);
        padding: var(--ss-space-4);
        background: var(--ss-color-surface);
        border-radius: var(--ss-radius-lg);
        box-shadow: var(--ss-shadow-sm);
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: var(--ss-space-3) var(--ss-space-2);
      }
      .quick-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        font-size: var(--ss-font-size-xs);
        color: var(--ss-color-text-secondary);
      }
      .quick-icon {
        width: 44px;
        height: 44px;
        border-radius: var(--ss-radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
      }
      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 var(--ss-space-4);
        margin-bottom: var(--ss-space-3);
      }
      .section-head h3 {
        font-size: var(--ss-font-size-lg);
        font-weight: var(--ss-font-weight-semibold);
      }
      .section-head a {
        font-size: var(--ss-font-size-sm);
        color: var(--ss-color-text-tertiary);
        text-decoration: none;
      }
      .product-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--ss-space-3);
        padding: 0 var(--ss-space-4) var(--ss-space-4);
      }
      .product-card {
        background: var(--ss-color-surface);
        border-radius: var(--ss-radius-lg);
        overflow: hidden;
        box-shadow: var(--ss-shadow-sm);
      }
      .product-card .product-thumb {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 0;
      }
      .product-card .info {
        padding: var(--ss-space-3);
      }
      .product-card .title {
        font-size: var(--ss-font-size-sm);
        color: var(--ss-color-text-primary);
        line-height: var(--ss-line-height-tight);
        height: 2.5em;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        margin-bottom: 6px;
      }
      .product-card .meta {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }
      .product-card .sold {
        font-size: var(--ss-font-size-xs);
        color: var(--ss-color-text-tertiary);
      }
    </style>
  </head>
  <body>
    <div class="phone" id="screen">
      <div class="home-header">
        <div class="status-bar dark">
          <span>9:41</span>
          <span style="display: flex; gap: 4px; align-items: center">
            <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="0.5"/><rect x="4.5" y="5" width="3" height="7" rx="0.5"/><rect x="9" y="2" width="3" height="10" rx="0.5"/><rect x="13" y="0" width="3" height="12" rx="0.5"/></svg>
            <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><path d="M1 4.5C5 0 13 0 17 4.5" stroke="currentColor" fill="none" stroke-width="1.5"/><path d="M3.5 7c3-2.5 8-2.5 11 0" stroke="currentColor" fill="none" stroke-width="1.5"/><circle cx="9" cy="10" r="1.5"/></svg>
            <svg width="22" height="11" viewBox="0 0 22 11" fill="currentColor"><rect x="0" y="1" width="18" height="9" rx="2" stroke="currentColor" fill="none" stroke-width="1"/><rect x="2" y="3" width="12" height="5" rx="1" fill="currentColor"/><rect x="19" y="4" width="2" height="3" rx="0.5"/></svg>
          </span>
        </div>
        <div class="location-row">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>
          <span>送至 · 上海市浦东新区</span>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
        </div>
        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#999"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <span style="flex:1;color:#bbb;font-size:14px">搜索商品、品牌或店铺</span>
          <span class="chip chip-tag">热卖</span>
        </div>
      </div>
      <div class="screen-body">
        <div class="scroll-content">
          <div class="banner">
            <div class="banner-text">
              <h2>暖冬焕新季</h2>
              <p>满299减50 · 演示活动文案</p>
            </div>
            <div class="banner-dots">
              <span class="active"></span><span></span><span></span>
            </div>
          </div>
          <div class="quick-nav">
            <div class="quick-item"><div class="quick-icon" style="background:#e3f2fd">📱</div>数码</div>
            <div class="quick-item"><div class="quick-icon" style="background:#fce4ec">👗</div>服饰</div>
            <div class="quick-item"><div class="quick-icon" style="background:#e8f5e9">🥗</div>生鲜</div>
            <div class="quick-item"><div class="quick-icon" style="background:#fff3e0">🏠</div>家居</div>
            <div class="quick-item"><div class="quick-icon" style="background:#f3e5f5">💄</div>美妆</div>
            <div class="quick-item"><div class="quick-icon" style="background:#e0f7fa">⚽</div>运动</div>
            <div class="quick-item"><div class="quick-icon" style="background:#fff8e1">👶</div>母婴</div>
            <div class="quick-item"><div class="quick-icon" style="background:#eceff1">📚</div>图书</div>
            <div class="quick-item"><div class="quick-icon" style="background:#ffebee">🎁</div>礼品</div>
            <div class="quick-item"><div class="quick-icon" style="background:#e8eaf6">⋯</div>更多</div>
          </div>
          <div class="section-head">
            <h3>猜你喜欢</h3>
            <a href="#">查看更多 ›</a>
          </div>
          <div class="product-grid">
            <div class="product-card">
              <div class="product-thumb"><svg viewBox="0 0 24 24" fill="#90a4ae"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></div>
              <div class="info">
                <div class="title">轻薄降噪无线耳机 演示款 Pro</div>
                <div class="meta"><span class="price">299.00</span><span class="sold">已售 2.3万</span></div>
              </div>
            </div>
            <div class="product-card">
              <div class="product-thumb"><svg viewBox="0 0 24 24" fill="#90a4ae"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></div>
              <div class="info">
                <div class="title">全棉宽松卫衣 中性款 雾霾蓝</div>
                <div class="meta"><span class="price">159.00</span><span class="sold">已售 8600</span></div>
              </div>
            </div>
            <div class="product-card">
              <div class="product-thumb"><svg viewBox="0 0 24 24" fill="#90a4ae"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></div>
              <div class="info">
                <div class="title">智能保温杯 液晶显温 500ml</div>
                <div class="meta"><span class="price price-lg" style="font-size:15px">89.00</span><span class="sold">已售 1.1万</span></div>
              </div>
            </div>
            <div class="product-card">
              <div class="product-thumb"><svg viewBox="0 0 24 24" fill="#90a4ae"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></div>
              <div class="info">
                <div class="title">氨基酸洁面乳 温和保湿 120g</div>
                <div class="meta"><span class="price">68.00</span><span class="sold">已售 5.6万</span></div>
              </div>
            </div>
          </div>
        </div>
        <nav class="tab-bar" aria-label="底部导航">
          <div class="tab-item active"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>首页</div>
          <div class="tab-item"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6 10h4v-4h-4v4zm0-6h4v-4h-4v4z"/></svg>分类</div>
          <div class="tab-item"><span class="badge-dot"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0 0 20 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg></span>购物车</div>
          <div class="tab-item"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>我的</div>
        </nav>
      </div>
    </div>
  </body>
</html>
