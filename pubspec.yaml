name: ss_fluxkit_workspace
publish_to: none

environment:
  sdk: ^3.5.0

workspace:
  - apps/ss_fluxkit_demo
  - packages/ss_core
  - packages/ss_network
  - packages/ss_ui
  - packages/ss_feed
  - packages/ss_media

dev_dependencies:
  melos: ^8.0.0

melos:
  repository: https://github.com/neufeng/SSFluxKit
  scripts:
    analyze:
      exec:
        command: flutter analyze --no-fatal-infos
        concurrency: 1
      description: Run flutter analyze in all packages.
    test:
      exec:
        command: flutter test
        concurrency: 1
      description: Run tests in all packages.
    format:
      exec:
        command: dart format .
      description: Format all packages.
